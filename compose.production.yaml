services:
  api:
    image: ${AGRO_API_IMAGE:?Defina la imagen API inmutable por digest}
    environment:
      AGRO_HEALTHCHECK_URL: http://127.0.0.1:8000/health/ready
      AGRO_HEALTHCHECK_EXPECTED_STATUS: ready
      AGRO_READER_KEY_FILE: /run/secrets/reader_key
      AGRO_MODEL_PROVIDER: openai
      AGRO_OPENAI_MODEL: ${AGRO_OPENAI_MODEL:?Defina el modelo OpenAI productivo}
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    secrets: [reader_key, openai_api_key]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    cpus: 2.0
    mem_limit: 2g
    restart: unless-stopped

  ui:
    image: ${AGRO_UI_IMAGE:?Defina la imagen UI inmutable por digest}
    environment:
      AGRO_READER_KEY_FILE: /run/secrets/reader_key
    secrets: [reader_key]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    cpus: 1.0
    mem_limit: 1g
    restart: unless-stopped

  gateway:
    image: ${AGRO_GATEWAY_IMAGE:?Defina la imagen gateway inmutable por digest}
    environment:
      AGRO_DOMAIN: ${AGRO_DOMAIN:?Defina el dominio TLS}
    depends_on:
      ui:
        condition: service_healthy
    ports:
      - name: http
        target: 80
        published: ${AGRO_HTTP_PORT:-80}
        protocol: tcp
      - name: https
        target: 443
        published: ${AGRO_HTTPS_PORT:-443}
        protocol: tcp
    secrets: [gateway_auth]
    volumes:
      - type: volume
        source: caddy_data
        target: /data
      - type: volume
        source: caddy_config
        target: /config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    cpus: 1.0
    mem_limit: 256m
    restart: unless-stopped
    networks: [application]

secrets:
  reader_key:
    file: ${AGRO_SECRETS_DIR:?Defina el directorio de secretos}/reader_key
  openai_api_key:
    file: ${AGRO_SECRETS_DIR:?Defina el directorio de secretos}/openai_api_key
  gateway_auth:
    file: ${AGRO_SECRETS_DIR:?Defina el directorio de secretos}/gateway_auth

volumes:
  catalogue:
    name: ${AGRO_CATALOGUE_VOLUME:?Defina el volumen de catálogo prepublicado}
    external: true
  caddy_data:
    name: ${AGRO_CADDY_DATA_VOLUME:-agrorag_caddy_data}
  caddy_config:
    name: ${AGRO_CADDY_CONFIG_VOLUME:-agrorag_caddy_config}
